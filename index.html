<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="البلوت">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<title>حاسبة البلوت</title>
<style>
:root{--bg:#0b1530;--card:#15234d;--fg:#ffffff;--ok:#4ade80;--bad:#f87171;--line:color-mix(in srgb,var(--fg) 18%,transparent);--mut:color-mix(in srgb,var(--fg) 60%,transparent);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;max-width:520px;margin-inline:auto;padding:16px}
input,select{font-family:inherit}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.top{display:flex;justify-content:flex-start}
.gear{background:none;font-size:24px;padding:4px}
.sc{display:flex;justify-content:space-around;text-align:center}
.sc b{display:block;font-size:34px}.sc span{font-size:68px;font-weight:300}
.ban{min-height:28px;text-align:center;font-weight:700;color:var(--ok);margin:6px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.c{width:104px;height:104px;border-radius:50%;border:6px solid var(--line);background:var(--card);color:var(--fg);font-size:30px;text-align:center}
.go{width:104px;height:104px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:22px;font-weight:700}
.act{display:flex;justify-content:space-around;margin:18px 0}
.act button{background:none;font-size:18px;padding:6px 14px;border-bottom:3px solid}
.nw{color:var(--ok)}.un{color:var(--bad)}
table{width:100%;border-collapse:collapse;text-align:center;font-size:22px}
td{padding:12px;border-top:1px solid var(--line)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-top:18px}
summary{font-size:20px;font-weight:700;cursor:pointer}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
select,.n{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:17px;text-align:center}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g div{font-size:12px;color:var(--mut);text-align:center}
.bsel{display:flex;gap:10px}
.bsel button{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:18px}
.bsel button.sel{background:var(--ok);border-color:var(--ok);color:#04210a;font-weight:700;box-shadow:0 0 14px var(--ok)}
.calc{width:100%;margin-top:12px;padding:12px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:700;font-size:17px}
.res{margin-top:12px;line-height:1.8}.res .t{font-size:19px;font-weight:700}
.reg{margin-top:8px;width:100%;padding:10px;border-radius:12px;background:none;border:1px solid var(--line)}
.set{display:none}.set.on{display:block}
.srow{display:flex;gap:8px;align-items:center;margin-top:8px}.srow input[type=color]{width:46px;height:36px;border:0;padding:0;background:none}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#pop.on{display:flex}
.box{background:var(--card);border:2px solid var(--ok);border-radius:22px;padding:30px 22px;text-align:center;width:100%;max-width:360px}
.box h1{font-size:34px;margin:0 0 20px}
.box button{padding:12px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:700;margin:4px}
:root{--sh:0 6px 14px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.1)}
.c,.go,.card,.n,.bsel button,.calc,.reg,.box,.box button,.act button{box-shadow:var(--sh)}
.c{box-shadow:inset 0 4px 10px rgba(0,0,0,.5),0 2px 0 rgba(255,255,255,.1)}
.sc span,.sc b{text-shadow:0 4px 10px rgba(0,0,0,.5)}
.go,.calc,.bsel button,.box button,.act button,.reg{transition:transform .1s,box-shadow .1s}
.go:active,.calc:active,.bsel button:active,.box button:active,.act button:active,.reg:active{transform:translateY(2px);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.g .n{padding:10px 2px}
.card{box-shadow:0 10px 24px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}
.tot{margin-top:12px;text-align:center;font-size:16px;color:var(--mut)}.tot b{color:var(--fg);font-size:24px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:16px;color:var(--fg)}
.chk input{width:22px;height:22px}
.mini{width:auto;margin:0;margin-inline-start:auto;padding:4px 10px}
</style>
</head>
<body>
<div class="top"><button class="gear" onclick="$('set').classList.toggle('on')">⚙️</button></div>
<div class="card set" id="set" style="margin-top:0">
<h2 style="margin:0 0 6px;font-size:20px">الإعدادات</h2>
<label>اسم الفريق الأول</label><input class="n" id="n0" oninput="setName(0,this.value)">
<label>اسم الفريق الثاني</label><input class="n" id="n1" oninput="setName(1,this.value)">
<label>الألوان</label>
<div class="srow"><input type="color" id="c_bg" oninput="setCol('bg',this.value)">الخلفية</div>
<div class="srow"><input type="color" id="c_card" oninput="setCol('card',this.value)">البطاقات</div>
<div class="srow"><input type="color" id="c_fg" oninput="setCol('fg',this.value)">النص</div>
<div class="srow"><input type="color" id="c_ok" oninput="setCol('ok',this.value)">لون التحديد</div>
<button class="reg" onclick="resetCol()">إعادة الألوان الافتراضية</button>
<label class="chk"><input type="checkbox" id="snd" onchange="S.snd=this.checked;saveS()"> تشغيل صوت عند الوصول إلى ١٥٢</label>
<label>صوت الفوز</label>
<select class="n" id="sm" onchange="S.sm=this.value;saveS()"></select>
<div class="tot" id="sn" style="font-size:13px;margin-top:4px"></div>
<button class="reg" onclick="playWin(1)">▶ تجربة الصوت</button>
<label class="chk"><input type="checkbox" id="wk" onchange="setWake(this.checked)"> إبقاء الشاشة تعمل أثناء استخدام التطبيق</label>
<div class="tot" id="wkn" style="font-size:13px;margin-top:4px"></div>
</div>
<div class="sc"><div><b class="nm0"></b><span id="sa">0</span></div><div><b class="nm1"></b><span id="sb">0</span></div></div>
<div class="ban" id="ban"></div>
<div class="row">
<input class="c" id="ia" type="number" inputmode="numeric" oninput="adv(this,'ib')">
<button class="go" onclick="addRound()">احسب</button>
<input class="c" id="ib" type="number" inputmode="numeric" oninput="adv(this,'ia')">
</div>
<div class="act"><button class="nw" onclick="newGame()">صكة جديدة</button><button class="un" onclick="undo()">تراجع</button></div>
<table><tbody id="hist"></tbody></table>
<div id="calcs"></div>
<div id="pop"><div class="box"><h1 id="popt"></h1><button onclick="newGame(1);closePop()">صكة جديدة</button><button onclick="closePop()">إغلاق</button></div></div>
<script>
var WIN=152,H=[],BUY={sun:0,hakam:0},ANC={sun:-1,hakam:-1};
var DEF={bg:'#0b1530',card:'#15234d',fg:'#ffffff',ok:'#4ade80'};
var S={n:['لنا','لهم'],c:Object.assign({},DEF),snd:true,sm:'rand',wake:true};
var $=function(i){return document.getElementById(i)};
try{H=JSON.parse(localStorage.getItem('bl')||'[]')}catch(e){}
try{var s=JSON.parse(localStorage.getItem('blset')||'null');if(s){S.n=s.n||S.n;Object.assign(S.c,s.c);if(typeof s.snd==='boolean')S.snd=s.snd;if(typeof s.sm==='string')S.sm=s.sm;if(typeof s.wake==='boolean')S.wake=s.wake}}catch(e){}
function saveS(){try{localStorage.setItem('blset',JSON.stringify(S))}catch(e){}}
function save(){try{localStorage.setItem('bl',JSON.stringify(H))}catch(e){}}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function theme(){var r=document.documentElement.style;for(var k in S.c){r.setProperty('--'+k,S.c[k]);$('c_'+k).value=S.c[k]}$('snd').checked=S.snd;$('wk').checked=S.wake}
function setCol(k,v){S.c[k]=v;theme();saveS()}
function resetCol(){S.c=Object.assign({},DEF);theme();saveS()}
function names(){
 for(var i=0;i<2;i++){document.querySelectorAll('.nm'+i).forEach(function(e){e.textContent=S.n[i]});$('n'+i).value=S.n[i]}
 $('ia').placeholder=S.n[0];$('ib').placeholder=S.n[1];
 ['sun','hakam'].forEach(function(k){$(k+'l0').textContent=S.n[BUY[k]];$(k+'l1').textContent=S.n[1-BUY[k]]});
}
function setName(i,v){S.n[i]=v.trim()||(i?'لهم':'لنا');names();saveS()}
function totals(){var a=0,b=0;H.forEach(function(r){a+=r[0];b+=r[1]});return [a,b]}
function render(){
 var t=totals(),a=t[0],b=t[1];
 $('sa').textContent=a;$('sb').textContent=b;
 $('hist').innerHTML=H.slice().reverse().map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('');
 var m='';
 if(a>=WIN||b>=WIN){m=a===b?'تعادل ('+a+') — لازم صكة زيادة':'الفوز '+(a>b?S.n[0]:S.n[1])+' 🎉'}
 $('ban').textContent=m;$('ban').style.color=(a===b&&m)?'var(--bad)':'var(--ok)';
}
var AC,SB=[],MAXS=10;
try{localStorage.removeItem('blsnd')}catch(e){}
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}
function unlock(){try{var a=ac();if(a.resume)a.resume();var b=a.createBuffer(1,1,22050),x=a.createBufferSource();x.buffer=b;x.connect(a.destination);x.start(0)}catch(e){}}
document.addEventListener('touchend',unlock,{once:true,passive:true});
document.addEventListener('click',unlock,{once:true});
function loadSnds(){
 var a;try{a=ac()}catch(e){fillSnd(true);return}
 var jobs=[];
 for(var i=1;i<=MAXS;i++)(function(i){
  jobs.push(fetch('sound'+i+'.mp3').then(function(r){return r.ok?r.arrayBuffer():null}).then(function(ab){
   return ab?new Promise(function(res){a.decodeAudioData(ab,function(b){res({i:i,n:'صوت '+i,b:b})},function(){res(null)})}):null;
  }).catch(function(){return null}));
 })(i);
 Promise.all(jobs).then(function(L){SB=L.filter(Boolean);fillSnd(true)});
}
function fillSnd(done){
 if(!done){$('sm').innerHTML='<option value="rand">جارٍ تحميل الأصوات…</option>';return}
 if(!SB.length){$('sm').innerHTML='<option value="rand">لا توجد أصوات</option>';$('sn').textContent='ارفع ملفات mp3 باسم sound1.mp3 و sound2.mp3 … في المستودع';return}
 var h='<option value="rand">عشوائي من الكل</option>';
 SB.forEach(function(x){h+='<option value="'+x.i+'">'+esc(x.n)+'</option>'});
 $('sm').innerHTML=h;$('sm').value=S.sm;
 if($('sm').value!==S.sm){S.sm='rand';$('sm').value='rand'}
 $('sn').textContent='';
}
function playWin(test){
 if(!S.snd&&!test)return;
 try{
  var a=ac();if(a.resume)a.resume();
  if(SB.length){
   var it=null;
   if(S.sm!=='rand')it=SB.filter(function(x){return String(x.i)===S.sm})[0];
   if(!it)it=SB[Math.floor(Math.random()*SB.length)];
   var src=a.createBufferSource();src.buffer=it.b;src.connect(a.destination);src.start(0);
  }
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
 }catch(e){}
}
function checkWin(){
 var t=totals();
 if((t[0]>=WIN||t[1]>=WIN)&&t[0]!==t[1]){$('popt').textContent='قامت على '+(t[0]>t[1]?S.n[1]:S.n[0]);$('pop').classList.add('on');playWin()}
}
var WL=null,WLP=false;
function wake(){
 if(!S.wake||WL||WLP||!('wakeLock' in navigator))return;
 WLP=true;
 navigator.wakeLock.request('screen').then(function(l){WL=l;WLP=false;l.addEventListener('release',function(){WL=null})}).catch(function(){WLP=false});
}
function setWake(v){S.wake=v;saveS();if(v)wake();else if(WL){WL.release();WL=null}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')wake()});
document.addEventListener('click',wake,{passive:true});
document.addEventListener('touchstart',wake,{passive:true});
function adv(el,id){var o=$(id);if(el.value.length>=2&&!o.value)o.focus()}
function closePop(){$('pop').classList.remove('on')}
function addRound(a,b){
 if(typeof a!=='number'){a=parseInt($('ia').value)||0;b=parseInt($('ib').value)||0}
 if(!a&&!b)return;
 H.push([a,b]);$('ia').value='';$('ib').value='';save();render();checkWin();
}
function undo(){H.pop();save();render()}
function newGame(f){if(f||!H.length||confirm('تبدأ لعبة جديدة؟')){H=[];save();render()}}

/*CORE*/
var CFG={
 sun:{n:'حسبة الصن',base:26,tot:130,pr:[['سرا',20,4],['خمسين',50,10],['مية',100,20],['أربعمية',200,40]],
  conv:function(x){if(x<5)return 0;if(x%10===5)return 2*Math.floor(x/10)+1;return 2*Math.round(x/10)}},
 hakam:{n:'حسبة الحكم',base:16,tot:162,pr:[['سرا',20,2],['خمسين',50,5],['مية',100,10]],bal:2,
  conv:function(x){if(x<5)return 0;if(x<=15)return 1;return Math.floor((x+4)/10)}}
};
function team(k,t){
 var c=CFG[k],top=-1,pts=0,un=0;
 c.pr.forEach(function(p,j){var n=t.n[j]||0;if(n){top=j;pts+=n*p[1];un+=n*p[2]}});
 var nb=c.bal?(t.bal||0):0;
 return {top:top,pts:pts,un:un,bal:nb*(c.bal||0),bp:nb*20};
}
function pinfo(k,T){
 var c=CFG[k],A=team(k,T[0]),B=team(k,T[1]),pu=[0,0],pp=[0,0];
 if(A.top>B.top||(A.top===B.top&&A.pts>B.pts)){pu[0]=A.un;pp[0]=A.pts}
 else if(B.top>A.top||(A.top===B.top&&B.pts>A.pts)){pu[1]=B.un;pp[1]=B.pts}
 return {I:[A,B],pu:pu,pp:pp,total:c.tot+pp[0]+pp[1]+A.bp+B.bp};
}
function evalG(k,by,fb,T){
 var c=CFG[k],pi=pinfo(k,T),cp=[0,0];
 cp[by]=fb;cp[1-by]=c.tot-fb;
 if(!(cp[0]>=0&&cp[1]>=0))return {err:'range',total:c.tot};
 var P=[cp[0]+pi.pp[0]+pi.I[0].bp,cp[1]+pi.pp[1]+pi.I[1].bp];
 var u=[0,0];u[by]=c.conv(cp[by]);u[1-by]=c.base-u[by];
 var ta=[u[0]+pi.pu[0]+pi.I[0].bal,u[1]+pi.pu[1]+pi.I[1].bal];
 var m,o;
 if(k==='hakam'){m=P[by];o=P[1-by]}else{m=ta[by];o=ta[1-by]}
 var tie=m===o,ok=m>o,f=ta.slice();
 if(!ok&&!tie){var all=c.base+pi.pu[0]+pi.pu[1];f[by]=pi.I[by].bal;f[1-by]=all+pi.I[1-by].bal}
 return {total:pi.total,P:P,cp:cp,u:ta,tie:tie,ok:ok,fin:f};
}
/*ENDCORE*/
function sel(k,id,m){var o='';for(var i=0;i<=m;i++)o+='<option>'+i+'</option>';return '<select class="n" id="'+id+'" onchange="refresh(\''+k+'\')">'+o+'</select>'}
function build(k){
 var c=CFG[k],ids=['a','b'],h='<details class="card"><summary>'+c.n+'</summary>';
 h+='<label>المشتري</label><div class="bsel"><button id="'+k+'buy0" onclick="buy(\''+k+'\',0)"><span class="nm0"></span></button><button id="'+k+'buy1" onclick="buy(\''+k+'\',1)"><span class="nm1"></span></button></div>';
 h+='<div class="tot">إجمالي اللعب: <b id="'+k+'tot">'+c.tot+'</b> نقطة</div>';
 h+='<label>نقاط <span id="'+k+'l0"></span> (المشتري) من الأوراق (من '+c.tot+')</label><input class="n" id="'+k+'f0" type="number" inputmode="numeric" placeholder="0" oninput="typed(\''+k+'\',0)">';
 h+='<label>نقاط <span id="'+k+'l1"></span> (الخصم) — تظهر تلقائياً</label><input class="n" id="'+k+'f1" type="number" inputmode="numeric" placeholder="0" oninput="typed(\''+k+'\',1)">';
 h+='<div class="tot" id="'+k+'sum"></div>';
 ids.forEach(function(t,i){
  h+='<label>مشاريع <span class="nm'+i+'"></span></label><div class="g">';
  c.pr.forEach(function(p,j){h+='<div>'+p[0]+sel(k,k+'_'+t+j,4)+'</div>'});
  if(c.bal)h+='<div>بلوت'+sel(k,k+'_'+t+'bal',1)+'</div>';
  h+='</div>';
 });
 h+='<button class="calc" onclick="calc(\''+k+'\')">احسب</button><div class="res" id="'+k+'res"></div></details>';
 return h;
}
$('calcs').innerHTML=build('sun')+build('hakam');
function readT(k){
 var c=CFG[k];
 return ['a','b'].map(function(t){
  return {n:c.pr.map(function(p,j){return Math.max(0,parseInt($(k+'_'+t+j).value)||0)}),bal:c.bal?Math.max(0,parseInt($(k+'_'+t+'bal').value)||0):0};
 });
}
function refresh(k){
 var c=CFG[k],T=readT(k),pi=pinfo(k,T);$(k+'tot').textContent=pi.total;
 var a=ANC[k],sm=$(k+'sum');sm.innerHTML='';
 if(a<0)return;
 var x=parseInt($(k+'f'+a).value),o=$(k+'f'+(1-a));
 if(isNaN(x)){o.value='';return}
 o.value=(c.tot-x>=0)?(c.tot-x):'';
 var f0=parseInt($(k+'f0').value);
 if(isNaN(f0))return;
 var r=evalG(k,BUY[k],f0,T),by=BUY[k];
 if(r.err)return;
 sm.innerHTML='المجموع مع المشاريع — '+esc(S.n[by])+': <b>'+r.P[by]+'</b> | '+esc(S.n[1-by])+': <b>'+r.P[1-by]+'</b>';
}
function typed(k,i){ANC[k]=i;refresh(k)}
function buy(k,i){
 if(i!==BUY[k]){var a=$(k+'f0'),b=$(k+'f1'),t=a.value;a.value=b.value;b.value=t;if(ANC[k]>=0)ANC[k]=1-ANC[k]}
 BUY[k]=i;$(k+'buy0').classList.toggle('sel',i===0);$(k+'buy1').classList.toggle('sel',i===1);names();refresh(k);
}
buy('sun',0);buy('hakam',0);
var LAST={};
function calc(k){
 var by=BUY[k],T=readT(k),res=$(k+'res');
 refresh(k);
 var f0=parseInt($(k+'f0').value);
 if(isNaN(f0)){res.textContent=ANC[k]<0?'اكتب نقاط المشتري أو الخصم أولاً':'النقاط أكبر من إجمالي الأوراق ('+CFG[k].tot+')';return}
 var r=evalG(k,by,f0,T);
 if(r.err){res.textContent='نقاط الأوراق لازم تكون بين 0 و '+r.total;return}
 LAST[k]=r.fin;
 var bn=esc(S.n[by]);
 var msg=r.tie?'تعادل':(r.ok?'نجح '+bn+' (المشتري)':'خسر '+bn+' (المشتري)');
 res.innerHTML='<div>إجمالي اللعب: <b>'+r.total+'</b> نقطة</div>'+
  '<div>نقاط '+bn+' (المشتري): <b>'+r.P[by]+'</b> ('+r.cp[by]+' أوراق'+(r.P[by]-r.cp[by]?' + '+(r.P[by]-r.cp[by])+' مشاريع':'')+')</div>'+
  '<div>نقاط '+esc(S.n[1-by])+' (الخصم): <b>'+r.P[1-by]+'</b> ('+r.cp[1-by]+' أوراق'+(r.P[1-by]-r.cp[1-by]?' + '+(r.P[1-by]-r.cp[1-by])+' مشاريع':'')+')</div>'+
  '<div>الأعداد — '+esc(S.n[0])+': '+r.u[0]+' | '+esc(S.n[1])+': '+r.u[1]+'</div>'+
  '<div class="t" style="color:var(--'+(r.ok?'ok':(r.tie?'fg':'bad'))+')">'+msg+'</div>'+
  '<div>النتيجة النهائية — '+esc(S.n[0])+': '+r.fin[0]+' ، '+esc(S.n[1])+': '+r.fin[1]+'</div>'+
  '<button class="reg" onclick="reg(\''+k+'\')">سجّلها في النتيجة</button>';
}
function reg(k){var r=LAST[k];if(r){addRound(r[0],r[1]);window.scrollTo({top:0,behavior:'smooth'})}}
theme();names();fillSnd();loadSnds();render();wake();if(!("wakeLock" in navigator))$("wkn").textContent="هذا المتصفح لا يدعم إبقاء الشاشة تعمل";
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
